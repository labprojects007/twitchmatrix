<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Twitch Matrix Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <style>
    :root { --accent:#9146FF; --bg:#1d1d1f; --panel:#19191b; --border:#313139; --muted:#bdbdbf; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: #f5f5f7; margin:0; padding:20px; font-size:15px; }
    .container { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
    h1 { margin:4px 0 0; font-size:21px; }

    .status { margin-top:6px; color: var(--muted); font-size:14px; min-height:20px; }
    .picked { margin-top:2px; color: #e6e6e8; font-size:14px; min-height:18px; }
    .tier-pill{
      border:1px solid var(--border);
      background:#232329;
      color:#d9d9de;
      border-radius:999px;
      padding:2px 8px;
      font-size:11px;
      white-space:nowrap;
    }
    .tier-pill .online-count{ color:#3dfb55; font-weight:700; }
    .retrieve-pending .tier-pill .online-count{ color:#9e9ea1; }

    /* Controls */
    .controls { width:100%; max-width:1100px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }

    .field { display:flex; align-items:center; gap:6px; font-size:13px; }
    .stepper { display:inline-flex; align-items:center; gap:6px; }
    .stepper input[type="number"]{
      width:56px; height:36px; padding:4px 6px; border-radius:9px; border:1px solid var(--border);
      background: var(--panel); color:#f5f5f7; text-align:center; font-size:14px;
    }
    .resolution-select{
      height:36px; min-width:92px; padding:4px 8px; border-radius:9px; border:1px solid var(--border);
      background: var(--panel); color:#f5f5f7; font-size:14px;
    }
    .step-btn{ height:36px; min-width:36px; padding:0 8px; font-size:15px; font-weight:700; border-radius:9px;
      border:1px solid var(--border); background:#2b2b31; color:#f5f5f7; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .step-btn:hover{ filter:brightness(1.08); }

    /* Primary buttons */
    .btn{ height:40px; min-width:150px; padding:0 16px; font-size:15px; border:none; border-radius:10px; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.25); }
    .btn.primary{ background:var(--accent); color:white; }
    .btn.secondary{ background:#2f2f35; color:#f5f5f7; border:1px solid var(--border); }
    .btn:disabled{ background:#555; cursor:not-allowed; }

    /* Grid */
    .grid { display:grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap:18px; margin-top:14px; align-items:start; }
    .tier { display:flex; flex-direction:column; align-items:stretch; }
    .tier h3 { text-align:left; margin:0 0 6px; font-size:14px; color:#d6d6d8; }
    .placeholder{ color:#9e9ea1; font-style:italic; padding:2px 2px; }

    .streamer{ display:flex; align-items:center; gap:4px; margin:2px 0; padding:1px 2px; border-radius:8px; }
    .online{ color:#3dfb55; }
    .offline{ color:#ff6b6b; }
    .unknown{ color:#9e9ea1; }
    .working{ color:#9cf; position:relative; padding-left:14px; }
    .working::before{ content:""; position:absolute; left:0; top:50%; width:10px; height:10px; margin-top:-5px;
      border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    .pin-btn,.black-btn{ border:1px solid var(--border); background:#222; color:#f5f5f7; cursor:pointer; font-size:14px;
      padding:3px 7px; border-radius:8px; line-height:1; font-weight:700; height:26px; min-width:30px; display:inline-flex; align-items:center; justify-content:center; }
    .pin-btn.active{ background:#19351a; color:#d6ff7a; border-color:#2f5c30; }
    .black-btn.active{ background:#3a1f2f; color:#ff9bd5; border-color:#6a2a4d; }

    .pick-star{ width:10px; text-align:center; color:#ffd54a; font-weight:700; opacity:0; transition:opacity .15s ease; }
    .streamer.selected .pick-star{ opacity:1; }

    .links { display:flex; gap:10px; justify-content:center; }

    /* Vertical steppers */
    .limits-vertical {
      display:grid;
      grid-template-columns: repeat(6, minmax(56px, 1fr));
      grid-template-rows: auto auto auto;
      gap:6px;
      align-items:stretch;
      justify-items:stretch;
      max-width:1100px;
      margin-inline:auto;
    }
    .limits-vertical .tier-label {
      grid-column: 1 / -1;
      text-align:left;
      color:#d6d6d8;
      font-size:13px;
      margin:4px 0;
      opacity:.85;
    }
    .limits-vertical .vbtn,
    .limits-vertical .vinput { width:100%; }
    .limits-vertical .vinput input[type="number"]{ width:100%; }

    /* Preview overlay */
    .preview-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.64);
      display: none;
      align-items: center; justify-content: center;
      z-index: 10001;
    }
    .preview-modal {
      background: #111;
      width: min(80vw, 1200px);
      height: min(80vh, 800px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 48px rgba(0,0,0,.6);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .preview-title { font-weight: 600; color: #eee; }
    .preview-close { cursor: pointer; font-size: 20px; line-height: 1; background: none; border: 0; color: #ddd; }
    .preview-close:hover { color: #fff; }
    .preview-body { padding: 12px; overflow: auto; }
    .matrix-picker-input {
      display: block;
      width: min(100%, 420px);
      margin: 0 auto;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #f5f5f7;
      font-size: 14px;
      text-align: center;
    }
    .preview-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .preview-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
    .preview-card img { display: block; width: 100%; height: auto; }
    .preview-meta { padding: 8px; font-size: 13px; color: #e6e6e8; }

    /* Matrix overlay */
    .matrix-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: none;
      align-items: stretch; justify-content: stretch;
      z-index: 10000;
    }
    .matrix-modal {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #000;
    }
    .matrix-header {
      position:relative;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      padding:10px 12px;
      background:#0a0a0a;
      border-bottom:1px solid #111;
      color:#ddd;
      min-height:42px;
    }
    .matrix-close { cursor:pointer; font-size:20px; line-height:1; background:none; border:0; color:#ddd; margin-left:auto; }
    .matrix-close:hover { color:#fff; }
    .matrix-refresh {
      background:var(--accent); color:#fff; border:0;
      padding:4px 12px; border-radius:6px; cursor:pointer; font-size:10px;
      flex:0 0 auto;
    }
    .matrix-refresh:hover { filter:brightness(1.1); }
    .matrix-refresh-countdown {
      color:#cfcfd4;
      font-size:10px;
      opacity:.9;
      min-width:34px;
      text-align:center;
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      z-index:1;
    }
    .matrix-online-feed{
      position:absolute;
      left:calc(50% + 30px);
      right:56px;
      top:50%;
      transform:translateY(-50%);
      overflow-x:auto;
      overflow-y:hidden;
      padding:0;
      pointer-events:auto;
      white-space:nowrap;
      min-height:14px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      cursor:grab;
    }
    .matrix-online-feed::-webkit-scrollbar{ display:none; }
    .matrix-online-feed-segment{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding-right:56px;
      color:#3dfb55;
      font-size:11px;
      line-height:1.2;
    }
    .matrix-online-feed-name{
      border:0; background:none; color:inherit; font:inherit; padding:0; cursor:pointer;
    }
    .matrix-online-feed-name:hover{ text-decoration:underline; }
    .matrix-online-feed-sep{ opacity:.65; }
    .retrieve-pending .matrix-online-feed-segment{ color:#9e9ea1; }
    .matrix-tier-stats{
      display:flex;
      gap:4px;
      position:absolute;
      left:84px;
      right:50%;
      overflow-x:auto;
      scrollbar-width:thin;
      padding-bottom:1px;
      justify-content:center;
    }
    .matrix-body {
      flex:1;
      overflow:auto;
      padding:2px;
      display:grid;
      column-gap:1px;
      row-gap:1px;
      justify-content:start;
      align-content:start;
      background:#000;
    }
    .tile {
      position:relative;
      background:#111;
      border-radius:8px;
      overflow:hidden;
      aspect-ratio: 16 / 9;
    }
    .tile iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .tile .twitch-player-div { position:absolute; inset:0; width:100%; height:100%; }

    .matrix-tile-button {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 0; cursor: pointer; z-index: 2;
    }
    .matrix-tile-button:hover { background: transparent; }
    .matrix-hit-zone {
      position: absolute;
      top: 0;
      height: 30%;
      background: transparent;
      z-index: 3;
      cursor: pointer;
    }
    .matrix-hit-zone.zone-quality { left: 0; width: 20%; }
    .matrix-hit-zone.zone-name { left: 20%; width: 60%; }
    .matrix-hit-zone.zone-pin { left: 80%; width: 20%; }
    .matrix-dead-zone {
      position: absolute;
      top: 30%;
      left: 0;
      width: 100%;
      height: 40%;
      background: transparent;
      z-index: 3;
    }

    .matrix-quality-btn {
      top: 0; left: 0;
      width: 52px; height: 52px;
      border-radius: 0 0 12px 0;
      font-size: 12px; font-weight: 700;
      color: #9ca3af;
      padding: 0;
    }
    .matrix-quality-btn.timer-pending { color: #ff9500 !important; }

    .matrix-quality-btn::after,
    .matrix-blacklist::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 26px; height: 26px;
      background: rgba(0,0,0,.65);
      border-radius: 6px;
      z-index: -1;
    }

    .matrix-blacklist {
      top: 0; right: 0;
      width: 52px; height: 52px;
      border-radius: 0 0 0 12px;
      font-size: 10px; font-weight: 700;
      color: #9ca3af;
      padding: 0;
    }
    .matrix-blacklist.state-pinned     { color: #22c55e; }
    .matrix-blacklist.state-blacklisted { color: #ff5555; }

    .matrix-streamer-name {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      z-index: 2;
      height: 48px;
      line-height: 48px;
      padding: 0 10px;
      max-width: calc(100% - 112px); /* leave 52px gap on each side for corner buttons */
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: transparent; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.7);
      border-radius: 0 0 8px 8px;   /* flat top, rounds bottom corners only */
      font-size: 12px; font-weight: 600;
      pointer-events: auto; border: 1px solid transparent; cursor: pointer;
      border-top: none;
    }
    .matrix-streamer-name:hover { border-color: rgba(255,255,255,.35); border-top: none; }
    .quality-dropdown { position: fixed; z-index: 10002; background: rgba(10,10,10,.96); border: 1px solid var(--border); border-radius: 6px; min-width: 190px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.6); }
    .quality-dropdown-item { display: block; width: 100%; padding: 11px 16px; background: none; border: 0; color: #f5f5f7; font-size: 14px; text-align: left; cursor: pointer; white-space: nowrap; }
    .quality-dropdown-item:hover { background: rgba(255,255,255,.1); }
    .quality-dropdown-item.danger { color: #ff6b6b; }
    .quality-dropdown-sep { height: 1px; background: var(--border); margin: 2px 0; }
    .matrix-streamer-picker{
      position:absolute; top:30px; left:50%; transform:translateX(-50%);
      z-index:3; max-width:70%;
      background:rgba(0,0,0,.9); color:#fff;
      border:1px solid var(--border); border-radius:6px;
      font-size:11px; padding:2px 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Twitch Matrix Generator</h1>
    <div class="status" id="status">Idle. Grid is ready. Click 'Retrieve' to fetch categories and statuses.</div>
    <div class="picked" id="pickedNames"></div>

    <div class="controls">
      <div class="row">
        <div class="field">Batch
          <div class="stepper">
            <button class="step-btn up" data-target="inputBatch">▲</button>
            <input type="number" id="inputBatch" min="1" max="200" step="1" value="20" aria-label="Batch size">
            <button class="step-btn down" data-target="inputBatch">▼</button>
          </div>
        </div>
        <div class="field">Size
          <div class="stepper">
            <button class="step-btn up" data-target="inputSize">▲</button>
            <input type="number" id="inputSize" min="1" max="12" step="1" value="6" aria-label="Grid size">
            <button class="step-btn down" data-target="inputSize">▼</button>
          </div>
        </div>
        <div class="field">Refresh
          <div class="stepper">
            <button class="step-btn up" data-target="inputRefresh">▲</button>
            <input type="number" id="inputRefresh" min="0" max="240" step="1" value="0" aria-label="Refresh">
            <button class="step-btn down" data-target="inputRefresh">▼</button>
          </div>
        </div>
        <div class="field">Resolution
          <select id="inputResolution" class="resolution-select" aria-label="Twitch resolution">
            <option value="160p" selected>160p</option>
            <option value="360p">360p</option>
            <option value="480p">480p</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
          </select>
        </div>
      </div>

      <div class="limits-vertical" id="limitsGrid">
        <div class="tier-label">Tier limits (T1–T6)</div>
        <button class="step-btn vbtn up" data-target="lim1">▲</button>
        <button class="step-btn vbtn up" data-target="lim2">▲</button>
        <button class="step-btn vbtn up" data-target="lim3">▲</button>
        <button class="step-btn vbtn up" data-target="lim4">▲</button>
        <button class="step-btn vbtn up" data-target="lim5">▲</button>
        <button class="step-btn vbtn up" data-target="lim6">▲</button>
        <div class="vinput"><input type="number" id="lim1" min="0" max="99" step="1" value="3" aria-label="Tier 1 limit"></div>
        <div class="vinput"><input type="number" id="lim2" min="0" max="99" step="1" value="1" aria-label="Tier 2 limit"></div>
        <div class="vinput"><input type="number" id="lim3" min="0" max="99" step="1" value="1" aria-label="Tier 3 limit"></div>
        <div class="vinput"><input type="number" id="lim4" min="0" max="99" step="1" value="1" aria-label="Tier 4 limit"></div>
        <div class="vinput"><input type="number" id="lim5" min="0" max="99" step="1" value="0" aria-label="Tier 5 limit"></div>
        <div class="vinput"><input type="number" id="lim6" min="0" max="99" step="1" value="0" aria-label="Tier 6 limit"></div>
        <button class="step-btn vbtn down" data-target="lim1">▼</button>
        <button class="step-btn vbtn down" data-target="lim2">▼</button>
        <button class="step-btn vbtn down" data-target="lim3">▼</button>
        <button class="step-btn vbtn down" data-target="lim4">▼</button>
        <button class="step-btn vbtn down" data-target="lim5">▼</button>
        <button class="step-btn vbtn down" data-target="lim6">▼</button>
      </div>

      <div class="row" id="randomRow">
        <label><input type="checkbox" id="rand1" checked> Random T1</label>
        <label><input type="checkbox" id="rand2" checked> Random T2</label>
        <label><input type="checkbox" id="rand3" checked> Random T3</label>
        <label><input type="checkbox" id="rand4" checked> Random T4</label>
        <label><input type="checkbox" id="rand5" checked> Random T5</label>
        <label><input type="checkbox" id="rand6" checked> Random T6</label>
      </div>

      <div class="row">
        <button class="btn secondary" id="retrieveBtn" title="Fetch categories and statuses for all names">Retrieve</button>
        <button class="btn primary" id="generateBtn" title="Pick from the cached results only">Generate</button>
        <button class="btn secondary" id="matrixBtn" title="Open embedded matrix (from last Generate)" disabled>Matrix</button>
      </div>

      <div class="row links">
        <button class="btn secondary" disabled id="openLink">Open TwitchTheater</button>
        <button class="btn secondary" disabled id="openMulti">Open MultiTwitch</button>
      </div>
    </div>
  </div>

  <div class="grid" id="gridContainer"></div>

  <div class="preview-backdrop" id="previewBackdrop">
    <div class="preview-modal" role="dialog" aria-modal="true" aria-label="Preview">
      <div class="preview-header">
        <div class="preview-title"></div>
        <button class="preview-close" aria-label="Close">×</button>
      </div>
      <div class="preview-body"></div>
    </div>
  </div>

  <div class="matrix-backdrop" id="matrixBackdrop">
    <div class="matrix-modal">
      <div class="matrix-header">
        <button class="matrix-refresh" id="matrixRefreshBtn">Refresh</button>
        <div class="matrix-tier-stats" id="matrixTierStats" aria-live="polite"></div>
        <div class="matrix-refresh-countdown" id="matrixRefreshCountdown" aria-live="polite"></div>
        <div class="matrix-online-feed" id="matrixOnlineFeed" aria-live="polite"></div>
        <button class="matrix-close" aria-label="Close">×</button>
      </div>
      <div class="matrix-body" id="matrixBody"></div>
    </div>
  </div>

<script>
/* ---------- Static tiers ---------- */
const TIERS_FILE = "twitchmatrixlists.txt";
let tier1 = [], tier2 = [], tier3 = [], tier4 = [];
let tier5 = [], tier6 = [];
let tiers = [tier1, tier2, tier3, tier4, tier5, tier6];

function parseTierText(text){
  const parsed = { tier1:[], tier2:[], tier3:[], tier4:[] };
  let currentTier = null;
  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trim();
    if(!line) continue;
    const header = line.match(/^\[(tier[1-4])\]$/);
    if(header){ currentTier = header[1]; continue; }
    if(currentTier){ parsed[currentTier].push(line); }
  }
  return parsed;
}

async function loadStaticTiers(){
  const res = await fetch(TIERS_FILE, { cache:"no-store" });
  if(!res.ok) throw new Error(`Failed to load ${TIERS_FILE} (HTTP ${res.status})`);
  const parsed = parseTierText(await res.text());
  tier1 = parsed.tier1; tier2 = parsed.tier2;
  tier3 = parsed.tier3; tier4 = parsed.tier4;
  tiers = [tier1, tier2, tier3, tier4, tier5, tier6];
}

/* ---------- GraphQL ---------- */
const clientId = "kimne78kx3ncx6brgo4mv6wki5h1ko";
const query = `query($login: String!) {
  user(login: $login) {
    stream { id title viewersCount game { name } }
  }
}`;
const categoryTopQuery = `query CategoryTop($name: String!, $limit: Int!) {
  game(name: $name) {
    id name
    streams(first: $limit, options: { sort: VIEWER_COUNT }) {
      edges { node { viewersCount broadcaster { login } } }
    }
  }
}`;

/* ---------- State ---------- */
const STATIC_HOST = window.location.hostname || window.location.host;
const statusEl = document.getElementById("status");
const pickedEl = document.getElementById("pickedNames");
const matrixTierStatsEl = document.getElementById("matrixTierStats");
const openBtn = document.getElementById("openLink");
const multiBtn = document.getElementById("openMulti");
const matrixBtn = document.getElementById("matrixBtn");
const matrixRefreshBtn = document.getElementById("matrixRefreshBtn");
let finalURL = "", multiURL = "";
let lastLive = [];
const resultsCache = new Map();
let lastRetrieveTime = 0;
let sessionPins = new Set();
let sessionBlacklist = new Set();

/* ---------- Persistent player state ----------
   matrixPlayers: Map<index, Twitch.Player>
   matrixTiles:   Map<index, tile DOM element>
   Players are NEVER destroyed after creation.
   Only setChannel() is called to change streams.
   Players persist for the full page session.
----------------------------------------------- */
const matrixPlayers = new Map();
const matrixTiles = new Map();
let matrixInitialized = false;
const MATRIX_RESOLUTION_DEFAULT = '160p';
const QUALITY_DELAY_MS = 20000;
function matrixResolution(forQuality=false) {
  const resolution = document.getElementById('inputResolution')?.value || MATRIX_RESOLUTION_DEFAULT;
  return forQuality ? `${resolution}30` : resolution;
}

/* ---------- Persistence ---------- */
const LS_KEY = "twitchcategories_settings_v2";
const COOKIE_SETTINGS_KEY = "twitchcategories_settings_v2";
const COOKIE_PINS_KEY = "twitchcategories_pins_v1";
const COOKIE_BLACKLIST_KEY = "twitchcategories_blacklist_v1";
function loadSettings(){ try{const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null;}catch{return null;} }
function saveSettings(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
function readCookie(name){
  const parts = document.cookie ? document.cookie.split("; ") : [];
  for(const part of parts){
    const i = part.indexOf("="); if(i<0) continue;
    const key = decodeURIComponent(part.slice(0, i));
    if(key !== name) continue;
    return decodeURIComponent(part.slice(i + 1));
  }
  return null;
}
function writeCookie(name, value, days=365){
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
}
function loadCookieJSON(name){
  try{ const raw = readCookie(name); return raw ? JSON.parse(raw) : null; }catch{ return null; }
}
function parseNameList(raw){
  if(!raw) return [];
  return raw.split(",").map(s=>s.trim()).filter(Boolean);
}
function savePinBlacklistCookies(){

function getSettings(){

/* ---------- Helpers ---------- */
function abbreviateCategory(cat){
  if(!cat) return "";
  const t = (cat+"").trim(); if(t.length<=4) return t;
  return t.split(/\s+/).slice(0,3).map(w=>w.slice(0,3)).join("");
}
function shuffledCopy(arr){ return [...arr].map(v=>({v, r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v); }
function orderedTierNames(i, pinned, blacklist, tierRandomize){
  const tier=tiers[i]||[];
  const pinsFirst=tier.filter(n=>pinned.has(n));
  const rest=tier.filter(n=>!pinned.has(n));
  const ordered = tierRandomize[i] ? [...pinsFirst, ...shuffledCopy(rest)] : [...pinsFirst, ...rest];
  return ordered.filter(n=>!blacklist.has(n));
}
function getBatchSize(){
  const n = parseInt(document.getElementById("inputBatch")?.value || "20", 10);
  return Number.isFinite(n) && n>0 ? n : 20;
}
function getTierOnlineSnapshot(){
  const limits = readLimits();
  return [0,1,2].map(i => {
    const names = tiers[i] || [];
    const online = names.reduce((acc, name) => acc + (resultsCache.get(name)?.isLive ? 1 : 0), 0);
    return { tier: i + 1, online, total: names.length, limit: limits[i] ?? 0 };
  });
}
function renderTierOnlineSnapshot(){
  if(!matrixTierStatsEl) return;
  const snapshot = getTierOnlineSnapshot();
  const hasLiveData = snapshot.some(s => s.online > 0) || resultsCache.size > 0;
  const html = snapshot.map(s => `<span class="tier-pill" title="Tier ${s.tier}"><span>${s.limit}</span> / <span class="online-count">${s.online}</span></span>`).join("");
  matrixTierStatsEl.innerHTML = hasLiveData ? html : "";
}

/* ---------- Networking ---------- */
async function fetchBatch(names){
  if(!names.length) return [];
  const ops = names.map(login => ({ operationName: null, query, variables: { login } }));
  const res = await fetch("https://gql.twitch.tv/gql", {
    method:"POST",
    headers:{ "Client-ID":clientId, "Content-Type":"application/json" },
    body: JSON.stringify(ops)
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  return data.map(d=>{
    const stream = d?.data?.user?.stream;
    return {
      isLive: !!stream,
      category: stream?.game?.name || null,
      title: stream?.title || null,
      viewers: (typeof stream?.viewersCount === 'number') ? stream.viewersCount : null
    };
  });
}
async function gqlSingle(op){
  const res = await fetch("https://gql.twitch.tv/gql", {
    method:"POST", headers:{ "Client-ID":clientId, "Content-Type":"application/json" },
    body: JSON.stringify([op])
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function fetchCategoryTop(catName, limit){
  const tryNames = catName==="IRL" ? ["IRL","Travel & Outdoors"] : [catName];
  for(const nm of tryNames){
    try{
      const data = await gqlSingle({ operationName:"CategoryTop", query:categoryTopQuery, variables:{ name:nm, limit } });
      const edges = data?.[0]?.data?.game?.streams?.edges || [];
      const logins = edges.map(e=>e?.node?.broadcaster?.login).filter(Boolean);
      logins.viewersByLogin = new Map(edges.map(e => [e?.node?.broadcaster?.login, e?.node?.viewersCount]).filter(([login]) => login));
      if(logins.length) return logins;
    }catch(e){ /* try next */ }
  }
  return [];
}
function pruneResultsCacheToVisibleNames() {
  const visibleNames = new Set([...tiers.flat(), ...getDisplayedMatrixStreams()]);
  for (const name of resultsCache.keys()) {
    if (!visibleNames.has(name)) resultsCache.delete(name);
  }
}

/* ---------- Phase 1: Retrieve ---------- */
let retrievePromise = null;
function setRetrievePending(isPending){ document.body.classList.toggle("retrieve-pending", !!isPending); }

async function retrieveAll(full = false){
  if (retrievePromise) return retrievePromise;
  retrievePromise = (async () => {
    setRetrievePending(true);
    try{
      statusEl.textContent = "Retrieving categories (top 20) and statuses…";
      pickedEl.textContent = "";
      if (full) {
        let [irl, jc] = await Promise.all([ fetchCategoryTop("IRL", 20), fetchCategoryTop("Just Chatting", 20) ]);
        const existing = new Set([ ...tier1, ...tier2, ...tier3, ...tier4 ]);
        irl = irl.filter(n => !existing.has(n));
        irl.forEach(n => existing.add(n));
        jc = jc.filter(n => !existing.has(n));
        replaceTier(4, irl);
        replaceTier(5, jc);
      }
      pruneResultsCacheToVisibleNames();
      const prevPins=new Set(sessionPins), prevBlack=new Set(sessionBlacklist);
      sessionPins = new Set(); sessionBlacklist = new Set();
      const visible = new Set(tiers.flat());
      prevPins.forEach(n=>{ if(visible.has(n)) sessionPins.add(n); });
      prevBlack.forEach(n=>{ if(visible.has(n)) sessionBlacklist.add(n); });
      savePinBlacklistCookies();
      syncPinBlacklistButtons();
      const statusTiers = full ? tiers : [tier1, tier2, tier3];
      const allNames = [...new Set([...statusTiers.flat(), ...getDisplayedMatrixStreams()])];
      const batchSize=getBatchSize();
      let processed=0;
      for(let i=0; i<allNames.length; ){
        const chunk=allNames.slice(i, i+batchSize); i+=batchSize;
        setWorking(chunk, true);
        try{
          const fetched = await fetchBatch(chunk);
          fetched.forEach((r, idx)=>{ const name=chunk[idx]; resultsCache.set(name, r); paintLabel(name, r); });
          processed += chunk.length;
          statusEl.textContent = `Retrieved ${processed}/${allNames.length}…`;
          renderTierOnlineSnapshot();
        }catch(e){ console.error("Batch error", e); markError(chunk); }
        finally{ setWorking(chunk, false); }
      }
      if (!full) {
        const irlNames = await fetchCategoryTop("IRL", 7);
        replaceTier(4, irlNames);
        irlNames.forEach(name => {
          resultsCache.set(name, { isLive: true, category: "IRL", viewers: irlNames.viewersByLogin?.get(name) ?? null, title: null });
          paintLabel(name, resultsCache.get(name));
        });
      }
      statusEl.textContent = "Retrieve complete. Click Generate to pick from cache.";
      renderTierOnlineSnapshot();
      renderMatrixOnlineFeed();
      lastRetrieveTime = Date.now();
    }catch(e){
      console.error(e);
      statusEl.textContent = "Retrieve failed (categories or status). See console for details.";
    } finally {
      setRetrievePending(false);
      retrievePromise = null;
    }
  })();
  return retrievePromise;
}

/* ---------- Phase 2: Generate ---------- */
function readLimits(){ return [1,2,3,4,5,6].map(i=>parseInt(document.getElementById("lim"+i).value||"0",10) || 0); }
function readRandoms(){ return [1,2,3,4,5,6].map(i=>document.getElementById("rand"+i).checked); }

function generateFromCache(){
  clearSelected(); pickedEl.textContent = "";
  const size = parseInt(document.getElementById("inputSize").value||"6",10);
  const tierLimits = readLimits();
  const tierRandomize = readRandoms();
  const pinned = new Set(sessionPins);
  const blacklist = new Set(sessionBlacklist);
  if(!resultsCache.size){ statusEl.textContent="No cached statuses. Click 'Retrieve' first."; openBtn.disabled=true; multiBtn.disabled=true; matrixBtn.disabled=true; lastLive=[]; return; }
  const perTier=[0,1,2,3,4,5].map(i => orderedTierNames(i, pinned, blacklist, tierRandomize));
  const live=[]; const usedTiers=[]; const counts=[0,0,0,0,0,0];
  for(let t=0; t<perTier.length && live.length<size; t++){
    const cap=tierLimits[t]; if(cap<=0) continue;
    for(const name of perTier[t]){
      if(live.length>=size || counts[t]>=cap) break;
      const r=resultsCache.get(name);
      if(r?.isLive){ live.push(name); counts[t]++; setSelected(name,true); if(!usedTiers.includes(`Tier ${t+1}`)) usedTiers.push(`Tier ${t+1}`); }
    }
  }
  if(live.length<size){
    for(let t=0; t<perTier.length && live.length<size; t++){
      for(const name of perTier[t]){
        if(live.includes(name)) continue;
        const r=resultsCache.get(name);
        if(r?.isLive){ live.push(name); setSelected(name,true); if(!usedTiers.includes(`Tier ${t+1}`)) usedTiers.push(`Tier ${t+1}`); if(live.length>=size) break; }
      }
    }
  }
  if(live.length){
    lastLive = live.slice();
    finalURL=`https://twitchtheater.tv/${live.join("/")}`;
    multiURL=`https://multitwitch.tv/${live.join("/")}`;
    openBtn.disabled=false; multiBtn.disabled=false; matrixBtn.disabled=false;
    statusEl.innerHTML = `<strong>Picked ${live.length}/${size}</strong> from: ${usedTiers.join(", ")}`;
    pickedEl.textContent = live.join(", ");
    renderMatrixOnlineFeed();
  } else {
    statusEl.textContent = "No live streamers matched the rules. Adjust limits/random/pins.";
    pickedEl.textContent=""; openBtn.disabled=true; multiBtn.disabled=true; matrixBtn.disabled=true; lastLive=[];
    renderMatrixOnlineFeed();
  }
}

/* ---------- Steppers & Persistence ---------- */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function attachStepperHandlers(){
  function adjust(input, dir){
    const min=parseInt(input.min||"0",10), max=parseInt(input.max||"999",10), step=parseInt(input.step||"1",10);
    const cur=parseInt(input.value||"0",10) || 0;
    const next=clamp(cur + (dir>0?step:-step), min, max);
    input.value=String(next);
    input.dispatchEvent(new Event("change"));
  }
  document.querySelectorAll(".step-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id=btn.getAttribute("data-target");
      const input=document.getElementById(id); if(!input) return;
      adjust(input, btn.classList.contains("up") ? +1 : -1);
    });
  });
  document.querySelectorAll('input[type="number"]').forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{
      if(e.key==="ArrowUp" || e.key==="ArrowDown"){
        const dir = e.key==="ArrowUp" ? +1 : -1;
        const mult = e.shiftKey ? 5 : 1;
        const min=parseInt(inp.min||"0",10), max=parseInt(inp.max||"999",10), step=parseInt(inp.step||"1",10)*mult;
        const cur=parseInt(inp.value||"0",10) || 0;
        inp.value = String(clamp(cur + dir*step, min, max));
        e.preventDefault();
        inp.dispatchEvent(new Event("change"));
      }
    });
  });
}

  [1,2,3,4,5,6].forEach(i=>document.getElementById("lim"+i).addEventListener("change", renderTierOnlineSnapshot));

const matrixRefreshCountdownEl = document.getElementById('matrixRefreshCountdown');
const matrixOnlineFeedEl = document.getElementById('matrixOnlineFeed');
let matrixRefreshIntervalId = null;
let matrixRefreshInProgress = false;
let matrixCountdownSeconds = 0;
let matrixResizeHandler = null;
const qualityTimers = new Map();

/* --- Player helpers --- */

function applyInitialMatrixQuality(player) {
  try {
    if (!player || typeof player.setQuality !== 'function') return;
    player.setQuality(matrixResolution(true));
  } catch(e) { /* ignore */ }
}

function applyBestQuality(player, desiredQuality) {
  try {
    if (!player || typeof player.setQuality !== 'function') return;

    let qualities;
    try {
      qualities = player.getQualities();
    } catch(e) {
      player.setQuality(desiredQuality);
      return;
    }

    if (!Array.isArray(qualities) || qualities.length === 0) {
      player.setQuality(desiredQuality);
      return;
    }

    const entries = qualities
      .filter((entry) => entry && entry.name !== 'auto' && entry.name !== '' && entry.height > 0)
      .sort((a, b) => a.height - b.height);

    const targetHeight = Number.parseInt(String(desiredQuality).split('p')[0], 10);
    const matchingEntry = entries.find((entry) => entry.height === targetHeight);

    if (matchingEntry) {
      player.setQuality(matchingEntry.name);
      return;
    }

    player.setQuality(entries[0].name);
  } catch(e) { /* ignore */ }
}

function updateQualityBtnState(index) {
  const tile = matrixTiles.get(index);
  if (!tile) return;
  const btn = tile.querySelector('.matrix-quality-btn');
  if (!btn) return;
  btn.classList.toggle('timer-pending', qualityTimers.has(index));
}

function applyMatrixQualityAfterDelay(index, player, delayMs = QUALITY_DELAY_MS) {
  if (!player || typeof player.setQuality !== 'function') return;
  const existing = qualityTimers.get(index);
  if (existing) clearTimeout(existing);

  const timerId = setTimeout(() => {
    if (qualityTimers.get(index) === timerId) {
      qualityTimers.delete(index);
      updateQualityBtnState(index);
      applyBestQuality(player, matrixResolution(true));
    }
  }, delayMs);
  qualityTimers.set(index, timerId);
  updateQualityBtnState(index);
}

function clearAllQualityTimers() {
  qualityTimers.forEach((timerId) => clearTimeout(timerId));
  qualityTimers.clear();
  matrixTiles.forEach((_, index) => updateQualityBtnState(index));
}

function closeQualityDropdowns() {
  document.querySelectorAll('.quality-dropdown').forEach((dropdown) => dropdown.remove());
}

function openQualityDropdown(index, player, btn) {
  closeQualityDropdowns();

  const dropdown = document.createElement('div');
  dropdown.className = 'quality-dropdown';

  const addItem = (label, action, className = '') => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = `quality-dropdown-item${className ? ` ${className}` : ''}`;
    item.textContent = label;
    item.onclick = (e) => {
      e.stopPropagation();
      action();
      closeQualityDropdowns();
    };
    dropdown.appendChild(item);
  };

  const addSep = () => {
    const sep = document.createElement('div');
    sep.className = 'quality-dropdown-sep';
    dropdown.appendChild(sep);
  };

  const cancelTimer = () => {
    const existing = qualityTimers.get(index);
    if (existing) clearTimeout(existing);
    qualityTimers.delete(index);
    updateQualityBtnState(index);
  };

  addItem('Apply now', () => {
    cancelTimer();
    applyBestQuality(player, matrixResolution(true));
  });

  if (qualityTimers.has(index)) {
    addSep();
    addItem('Cancel timer', cancelTimer, 'danger');
  }

  addSep();
  [
    ['15s set quality', 15000],
    ['30s set quality', 30000],
    ['2m set quality', 120000],
    ['3m set quality', 180000],
    ['5m set quality', 300000],
  ].forEach(([label, ms]) => {
    addItem(label, () => applyMatrixQualityAfterDelay(index, player, ms));
  });

  const rect = btn.getBoundingClientRect();
  dropdown.style.top = `${rect.bottom + 4}px`;
  dropdown.style.left = `${rect.left}px`;
  document.body.appendChild(dropdown);

  setTimeout(() => {
    document.addEventListener('click', closeQualityDropdowns, { once: true });
  }, 0);
}

function setTwitchPlayerChannel(index, channelName) {
  /* The ONLY correct way to change a stream without destroying the player.
     Twitch.Player.setChannel() transitions the existing decoder context
     to the new channel — zero GPU allocation, zero memory leak. */
  const player = matrixPlayers.get(index);
  if (!player) return;
  if (typeof player.setChannel === 'function') {
    player.setChannel(channelName);
    applyMatrixQualityAfterDelay(index, player);
  } else {
    console.warn(`setChannel not available on player ${index}`);
  }
}

function updateTileBadge(index, channelName) {
  const tile = matrixTiles.get(index);
  if (!tile) return;
  tile.dataset.streamer = channelName;
  const badge = tile.querySelector('.matrix-streamer-name');
  if (badge) badge.textContent = channelName;
  const xbtn = tile.querySelector('.matrix-blacklist');
  if (xbtn) setMatrixPinStateButtonStyle(xbtn, channelName);
}

/* --- Interval --- */
function getRefreshMinutes() {
  const n = parseInt(document.getElementById("inputRefresh")?.value || "0", 10);
  return Number.isFinite(n) && n >= 0 ? n : 0;
}
function stopMatrixRefreshInterval() {
  if (!matrixRefreshIntervalId) return;
  clearInterval(matrixRefreshIntervalId);
  matrixRefreshIntervalId = null;
}
function formatRemainingSeconds(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${String(secs).padStart(2, '0')}`;
}
function renderMatrixRefreshCountdown() {
  if (!matrixRefreshCountdownEl) return;
  const minutes = getRefreshMinutes();
  if (minutes <= 0) { matrixRefreshCountdownEl.textContent = ''; return; }
  matrixRefreshCountdownEl.textContent = formatRemainingSeconds(matrixCountdownSeconds);
}
function startMatrixRefreshInterval() {
  stopMatrixRefreshInterval();
  const minutes = getRefreshMinutes();
  matrixCountdownSeconds = Math.max(0, minutes * 60);
  renderMatrixRefreshCountdown();
  if (minutes <= 0) return;
  matrixRefreshIntervalId = setInterval(() => {
    matrixCountdownSeconds = Math.max(0, matrixCountdownSeconds - 10);
    renderMatrixRefreshCountdown();
    if (matrixCountdownSeconds > 0) return;
    matrixCountdownSeconds = minutes * 60;
    renderMatrixRefreshCountdown();
    if (!matrixRefreshInProgress) {
      matrixRefreshInProgress = true;
      refreshDisplayedMatrixStreams()
        .catch(err => console.error("Interval refresh failed", err))
        .finally(() => { matrixRefreshInProgress = false; });
    }
  }, 10000);
}

/* --- Displayed streams --- */
function getDisplayedMatrixStreams() {
  const result = [];
  matrixTiles.forEach((tile) => {
    if (tile.dataset.streamer) result.push(tile.dataset.streamer);
  });
  return result;
}

/* --- Picker --- */
function closeAllMatrixStreamPickers() {
  matrixBody.querySelectorAll('.matrix-streamer-picker').forEach(el => el.remove());
}

function setMatrixPinStateButtonStyle(btn, name) {
  if (!btn || !name) return;
  btn.classList.remove('state-pinned', 'state-blacklisted');
  if (sessionPins.has(name)) {
    btn.classList.add('state-pinned'); btn.textContent = '✓'; btn.title = 'Pinned (click to clear)'; return;
  }
  if (sessionBlacklist.has(name)) {
    btn.classList.add('state-blacklisted'); btn.textContent = '✖'; btn.title = 'Blacklisted (click to pin)'; return;
  }
  btn.textContent = '-'; btn.title = 'Neutral (click to blacklist)';
}

function cycleMatrixTilePinState(tile, btn) {
  if (!tile || !btn) return;
  const name = tile.dataset.streamer; if (!name) return;
  if (!sessionPins.has(name) && !sessionBlacklist.has(name)) { sessionBlacklist.add(name); }
  else if (sessionBlacklist.has(name)) { sessionBlacklist.delete(name); sessionPins.add(name); }
  else { sessionPins.delete(name); }
  sessionPins.forEach(n=>{ if(sessionBlacklist.has(n)) sessionBlacklist.delete(n); });
  savePinBlacklistCookies();
  syncPinBlacklistButtons();
  setMatrixPinStateButtonStyle(btn, name);
}

function getMatrixReplacementCandidates(currentName) {
  const displayed = new Set(getDisplayedMatrixStreams().map(n => String(n).toLowerCase()));
  displayed.delete(String(currentName || '').toLowerCase());
  return getOnlineFeedNames()
    .map(item => item.name)
    .filter(Boolean)
    .filter(name => !displayed.has(String(name).toLowerCase()));
}

/* --- Single stream replacement — setChannel only, no teardown --- */
function replaceMatrixTileStream(tile, nextName) {
  if (!tile || !nextName) return;
  const prevName = tile.dataset.streamer || '';
  if (prevName && String(prevName).toLowerCase() === String(nextName).toLowerCase()) return;

  /* Find the index for this tile */
  let tileIndex = -1;
  matrixTiles.forEach((t, idx) => { if (t === tile) tileIndex = idx; });
  if (tileIndex === -1) return;

  /* Update lastLive */
  lastLive = lastLive.map(n =>
    String(n).toLowerCase() === String(prevName).toLowerCase() ? nextName : n
  );

  /* Change channel on existing player — zero memory cost */
  setTwitchPlayerChannel(tileIndex, nextName);

  /* Update tile metadata */
  updateTileBadge(tileIndex, nextName);

  /* Sync xbtn onclick for new name */
  const xbtn = tile.querySelector('.matrix-blacklist');
  if (xbtn) xbtn.onclick = () => cycleMatrixTilePinState(tile, xbtn);

  renderMatrixOnlineFeed();
}

function doSwap(sourceTile, targetName) {
  if (!sourceTile || !targetName) return;
  const currentName = sourceTile.dataset.streamer || '';
  let sourceIndex = -1;
  let targetIndex = -1;
  matrixTiles.forEach((t, idx) => {
    if (t === sourceTile) sourceIndex = idx;
    if (String(t.dataset.streamer || '').toLowerCase() === String(targetName).toLowerCase()) targetIndex = idx;
  });
  if (sourceIndex === -1 || targetIndex === -1) return;

  setTwitchPlayerChannel(sourceIndex, targetName);
  setTwitchPlayerChannel(targetIndex, currentName);
  updateTileBadge(sourceIndex, targetName);
  updateTileBadge(targetIndex, currentName);

  const swappedLive = lastLive.slice();
  const sourceLive = swappedLive[sourceIndex];
  swappedLive[sourceIndex] = swappedLive[targetIndex];
  swappedLive[targetIndex] = sourceLive;
  lastLive = swappedLive;

  renderMatrixOnlineFeed();
}

async function openMatrixTilePicker(tile) {
  if (!tile) return;

  const PICKER_CACHE_TTL_MS = 10 * 60 * 1000; // 10 minutes
  if (Date.now() - lastRetrieveTime > PICKER_CACHE_TTL_MS) {
    await retrieveAll(false);
  }

  const currentName = tile.dataset.streamer || '';
  const swapCandidates = getDisplayedMatrixStreams()
    .filter(name => String(name).toLowerCase() !== String(currentName).toLowerCase());
  const replaceCandidates = getMatrixReplacementCandidates(currentName);

  const container = document.createElement('div');
  const streamerInput = document.createElement('input');
  streamerInput.className = 'matrix-picker-input';
  streamerInput.type = 'text';
  streamerInput.placeholder = 'Enter streamer name…';
  streamerInput.autocomplete = 'off';
  streamerInput.autocorrect = 'off';
  streamerInput.autocapitalize = 'off';
  streamerInput.spellcheck = false;
  streamerInput.inputMode = 'url';
  streamerInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const nextName = streamerInput.value.trim();
    if (!nextName) return;
    replaceMatrixTileStream(tile, nextName);
    closePreview();
  });
  container.appendChild(streamerInput);

  if (swapCandidates.length) {
    const label = document.createElement('div');
    label.textContent = 'Swap with';
    label.style.color = '#a3e635';
    label.style.position = 'sticky';
    label.style.top = '-12px';
    label.style.zIndex = '2';
    label.style.background = '#111';
    label.style.fontSize = '14px';
    label.style.fontWeight = '700';
    label.style.padding = '12px 0 6px';
    container.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'preview-grid';
    swapCandidates.forEach(name => {
      grid.appendChild(makePreviewCard(name, (name) => { doSwap(tile, name); }));
    });
    container.appendChild(grid);
  }

  if (replaceCandidates.length) {
    const label = document.createElement('div');
    label.textContent = 'Replace with';
    label.style.color = '#3dd6f5';
    label.style.position = 'sticky';
    label.style.top = '-12px';
    label.style.zIndex = '2';
    label.style.background = '#111';
    label.style.fontSize = '14px';
    label.style.fontWeight = '700';
    label.style.padding = '12px 0 6px';
    container.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'preview-grid';
    replaceCandidates.forEach(name => {
      grid.appendChild(makePreviewCard(name, (name) => { replaceMatrixTileStream(tile, name); }));
    });
    container.appendChild(grid);
  }

  openPreview({ title: currentName, nodes: [container] });
  previewBackdrop.querySelector('.preview-body').scrollTop = 0;
}

/* --- Feed --- */
function getOnlineFeedNames() {
  const hidden = new Set(lastLive || []);
  const names = [];
  for(const i of [0, 1, 2, 4]){
    for(const name of (tiers[i] || [])){
      const r = resultsCache.get(name);
      if(!r?.isLive || hidden.has(name)) continue;
      const suffix = r.category ? ` (${abbreviateCategory(r.category)})` : '';
      names.push({ name, label: `${name}${suffix}` });
    }
  }
  return names;
}
function renderMatrixOnlineFeed() {
  if (!matrixOnlineFeedEl) return;
  const feedItems = getOnlineFeedNames();
  if (!feedItems.length) { matrixOnlineFeedEl.innerHTML = ''; return; }
  const markup = feedItems
    .map((item, idx) => `${idx ? '<span class="matrix-online-feed-sep">•</span>' : ''}<button type="button" class="matrix-online-feed-name" data-name="${item.name}">${item.label}</button>`)
    .join('');
  matrixOnlineFeedEl.innerHTML = `<span class="matrix-online-feed-segment">${markup}</span>`;
}
async function retrieveThenOpenOnlinePreview() {
  await retrieveAll(false);
  const feedItems = getOnlineFeedNames();
  if (!feedItems.length) return;
  const grid = document.createElement("div");
  grid.className = "preview-grid";
  feedItems.forEach(item => grid.appendChild(makePreviewCard(item.name)));
  openPreview({ title: "Online", nodes: [ grid ] });
}
matrixOnlineFeedEl?.addEventListener("click", async (e) => {
  e.preventDefault();
  await retrieveThenOpenOnlinePreview();
});
matrixTierStatsEl?.addEventListener("click", async (e) => {
  const pill = e.target.closest(".tier-pill");
  if (!pill || !matrixTierStatsEl.contains(pill)) return;
  e.preventDefault();
  await retrieveThenOpenOnlinePreview();
});

/* --- Refresh displayed streams (timer path) --- */
async function refreshDisplayedMatrixStreams() {
  if (matrixBackdrop.style.display !== 'flex') return;
  const displayed = getDisplayedMatrixStreams();
  if (!displayed.length) return;
  const fetched = await fetchBatch(displayed);
  let anyOffline = false;
  fetched.forEach((r, idx) => {
    const name = displayed[idx];
    resultsCache.set(name, r);
    paintLabel(name, r);
    if (!r?.isLive) anyOffline = true;
  });
  if (anyOffline) {
    await refreshMatrix();
  }
}

/* --- Layout --- */
const WIDTH_FILL_AREA_TOLERANCE = 0.10;

function optimalCols(n, W, H, gap) {
  let best = null;
  let bestWidthBound = null;

  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const totalGapW = gap * (cols - 1);
    const totalGapH = gap * (rows - 1);

    const tileWWidthOnly = Math.max(0, (W - totalGapW) / cols);
    const tileHWidthOnly = tileWWidthOnly * 9 / 16;
    const areaWidthOnly = tileWWidthOnly * tileHWidthOnly * (n / (rows * cols));

    const tileWfromW = Math.floor(tileWWidthOnly);
    const tileHfromH = Math.floor(Math.max(0, (H - totalGapH) / rows));
    const tileWfromH = Math.floor(tileHfromH * 16 / 9);
    const tileWFinal = Math.min(tileWfromW, tileWfromH);
    const tileHFinal = tileWFinal * 9 / 16;
    const areaFinal = tileWFinal * tileHFinal * (n / (rows * cols));
    const candidate = { cols, areaFinal, areaWidthOnly, widthBound: tileWfromW <= tileWfromH };

    if (!best || areaFinal > best.areaFinal || (areaFinal === best.areaFinal && cols > best.cols)) {
      best = candidate;
    }

    if (candidate.widthBound && (!bestWidthBound || areaFinal > bestWidthBound.areaFinal || (areaFinal === bestWidthBound.areaFinal && cols > bestWidthBound.cols))) {
      bestWidthBound = candidate;
    }
  }

  if (bestWidthBound && bestWidthBound.areaFinal >= best.areaFinal * (1 - WIDTH_FILL_AREA_TOLERANCE)) {
    return bestWidthBound.cols;
  }

  return best.cols;
}

function applyMatrixLayout() {
  const n = Math.max(1, lastLive.length);
  const tiles = matrixBody.children;
  Array.from(tiles).forEach(t => { t.style.gridColumn = ''; t.style.gridRow = ''; });
  matrixBody.style.gridTemplateColumns = '';
  matrixBody.style.gridTemplateRows = '';
  matrixBody.style.paddingLeft = '';
  matrixBody.style.paddingRight = '';
  const gap = 1;
  const matrixStyle = getComputedStyle(matrixBody);
  const basePaddingLeft = parseFloat(matrixStyle.paddingLeft) || 0;
  const basePaddingRight = parseFloat(matrixStyle.paddingRight) || 0;
  const basePaddingTop = parseFloat(matrixStyle.paddingTop) || 0;
  const basePaddingBottom = parseFloat(matrixStyle.paddingBottom) || 0;
  const rect = matrixBody.getBoundingClientRect();
  let width = Math.max(0, rect.width - basePaddingLeft - basePaddingRight);
  let height = Math.max(0, rect.height - basePaddingTop - basePaddingBottom);
  if (!width || !height) {
    width = Math.max(0, window.innerWidth - basePaddingLeft - basePaddingRight);
    height = Math.max(0, window.innerHeight - (matrixHeader.offsetHeight || 42) - basePaddingTop - basePaddingBottom);
  }

  const cols = optimalCols(n, width, height, gap);
  const rows = Math.ceil(n / cols);

  // Size tiles to fit width
  const tileWfromW = Math.floor((width - gap * (cols - 1)) / cols);
  const tileHfromW = Math.floor(tileWfromW * 9 / 16);

  // Size tiles to fit height
  const tileHfromH = Math.floor((height - gap * (rows - 1)) / rows);
  const tileWfromH = Math.floor(tileHfromH * 16 / 9);

  // Use whichever constraint is tighter
  const tileW = Math.min(tileWfromW, tileWfromH);
  const tileH = Math.floor(tileW * 9 / 16);
  const gridW = cols * tileW + gap * (cols - 1);
  const horizontalMargin = Math.max(0, Math.floor((width - gridW) / 2));
  matrixBody.style.columnGap = `${gap}px`;
  matrixBody.style.rowGap = `${gap}px`;
  matrixBody.style.paddingLeft = `${basePaddingLeft + horizontalMargin}px`;
  matrixBody.style.paddingRight = `${basePaddingRight + Math.max(0, width - gridW - horizontalMargin)}px`;
  matrixBody.style.gridTemplateColumns = `repeat(${cols}, ${tileW}px)`;
  matrixBody.style.gridTemplateRows = `repeat(${rows}, ${tileH}px)`;
  Array.from(matrixBody.children).forEach(t => {
    t.style.aspectRatio = 'unset';
    t.style.height = '100%';
    t.style.width = '100%';
  });
}

/* --- openMatrix ---
   First call: creates Twitch.Player instances and DOM tiles.
   Subsequent calls (refresh): updates existing players via setChannel.
   Players are NEVER destroyed. --------------------------------------- */
function openMatrix() {
  if (!lastLive.length) return;

  if (!STATIC_HOST) {
    console.error('No hostname — cannot embed Twitch');
    return;
  }

  matrixBackdrop.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  if (!matrixInitialized) {
    /* First open — build tiles and create players */
    matrixBody.innerHTML = '';
    matrixPlayers.clear();
    matrixTiles.clear();

    lastLive.forEach((name, index) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.streamer = name;

      /* Twitch.Player needs a div with a unique id to inject into */
      const playerDiv = document.createElement('div');
      playerDiv.id = `twitch-player-${index}`;
      playerDiv.className = 'twitch-player-div';
      tile.appendChild(playerDiv);

      const qualityBtn = document.createElement('button');
      qualityBtn.type = 'button';
      qualityBtn.className = 'matrix-tile-button matrix-quality-btn';
      qualityBtn.textContent = '↺';
      qualityBtn.title = 'Apply selected quality';
      qualityBtn.onclick = (e) => {
        e.stopPropagation();
        if (document.querySelector('.quality-dropdown')) {
          closeQualityDropdowns();
          return;
        }

        openQualityDropdown(index, player, qualityBtn);
      };

      const xbtn = document.createElement('button');
      xbtn.className = 'matrix-tile-button matrix-blacklist';
      setMatrixPinStateButtonStyle(xbtn, name);
      xbtn.onclick = () => cycleMatrixTilePinState(tile, xbtn);

      const nameBadge = document.createElement('button');
      nameBadge.type = 'button';
      nameBadge.className = 'matrix-streamer-name';
      nameBadge.textContent = name;
      nameBadge.title = 'Change stream';
      nameBadge.dataset.role = 'matrix-name-picker';

      const qualityZone = document.createElement('div');
      qualityZone.className = 'matrix-hit-zone zone-quality';
      qualityZone.onclick = (e) => { e.stopPropagation(); qualityBtn.click(); };

      const nameZone = document.createElement('div');
      nameZone.className = 'matrix-hit-zone zone-name';
      nameZone.onclick = (e) => { e.stopPropagation(); nameBadge.click(); };

      const pinZone = document.createElement('div');
      pinZone.className = 'matrix-hit-zone zone-pin';
      pinZone.onclick = (e) => { e.stopPropagation(); xbtn.click(); };

      const deadZone = document.createElement('div');
      deadZone.className = 'matrix-dead-zone';
      deadZone.onclick = (e) => { e.stopPropagation(); e.preventDefault(); };

      tile.append(qualityBtn, xbtn, nameBadge);
      tile.append(qualityZone, nameZone, pinZone, deadZone);
      matrixBody.appendChild(tile);
      matrixTiles.set(index, tile);

      /* Create the persistent Twitch.Player instance */
      const player = new Twitch.Player(`twitch-player-${index}`, {
        channel: name,
        width: '100%',
        height: '100%',
        autoplay: true,
        muted: true,
        volume: 0,
        controls: true,
        quality: matrixResolution(),
        parent: [STATIC_HOST]
      });
      matrixPlayers.set(index, player);
      player.addEventListener(Twitch.Player.READY, () => {
        applyInitialMatrixQuality(player);
      });
    });

    matrixInitialized = true;

  } else {
    const currentLive = getDisplayedMatrixStreams();
    const candidates = lastLive.slice();

    const kept = new Set(
      currentLive
        .filter(n => resultsCache.get(n)?.isLive)
        .map(n => n.toLowerCase())
    );

    let ci = 0;
    lastLive = currentLive.map(name => {
      if (resultsCache.get(name)?.isLive) return name;
      while (ci < candidates.length) {
        const pick = candidates[ci++];
        if (!kept.has(pick.toLowerCase())) {
          kept.add(pick.toLowerCase());
          return pick;
        }
      }
      return name;
    });

    /* Subsequent opens — reconcile target list against current slots.
       Preserve slots whose streamer is still desired, and only setChannel
       on slots that truly need a new streamer. */
    const desiredNames = Array.isArray(lastLive) ? lastLive.slice() : [];
    const desiredLowerSet = new Set(desiredNames.map(name => String(name).toLowerCase()));

    const currentNamesByIndex = new Map();
    const retainedLowerSet = new Set();
    const slotsNeedingReplacement = [];

    matrixPlayers.forEach((_, index) => {
      const currentName = String(matrixTiles.get(index)?.dataset?.streamer || '').trim();
      currentNamesByIndex.set(index, currentName);

      const currentLower = currentName.toLowerCase();
      if (currentLower && desiredLowerSet.has(currentLower)) {
        retainedLowerSet.add(currentLower);
      } else {
        slotsNeedingReplacement.push(index);
      }
    });

    const namesNeedingAssignment = desiredNames.filter(name => {
      const lower = String(name).toLowerCase();
      return !retainedLowerSet.has(lower);
    });

    const finalNamesByIndex = new Map(currentNamesByIndex);

    slotsNeedingReplacement.forEach((index, i) => {
      const nextName = namesNeedingAssignment[i];
      if (!nextName) return;
      finalNamesByIndex.set(index, nextName);
    });

    matrixPlayers.forEach((_, index) => {
      const currentName = currentNamesByIndex.get(index) || '';
      const finalName = String(finalNamesByIndex.get(index) || '').trim();

      if (!finalName) return;

      if (currentName.toLowerCase() !== finalName.toLowerCase()) {
        setTwitchPlayerChannel(index, finalName);
        updateTileBadge(index, finalName);

        const tile = matrixTiles.get(index);
        if (tile) {
          const xbtn = tile.querySelector('.matrix-blacklist');
          if (xbtn) {
            setMatrixPinStateButtonStyle(xbtn, finalName);
            xbtn.onclick = () => cycleMatrixTilePinState(tile, xbtn);
          }
        }
      }
    });

    /* Persist the final slot assignments (index order) as the new lastLive. */
    const finalAssignedNames = [];
    matrixPlayers.forEach((_, index) => {
      const finalName = String(finalNamesByIndex.get(index) || '').trim();
      if (finalName) finalAssignedNames.push(finalName);
    });
    lastLive = finalAssignedNames;

    /* Resume players that were paused on close */
  }

  renderMatrixOnlineFeed();
  startMatrixRefreshInterval();

  const ro = new ResizeObserver((entries, observer) => {
    const entry = entries[0];
    const w = entry.contentRect.width;
    const h = entry.contentRect.height;
    if (w > 0 && h > 0) {
      observer.disconnect();
      applyMatrixLayout();

      if (matrixResizeHandler) window.removeEventListener('resize', matrixResizeHandler);
      matrixResizeHandler = applyMatrixLayout;
      window.addEventListener('resize', matrixResizeHandler, { passive: true });
    }
  });
  ro.observe(matrixBody);
}

/* --- closeMatrix — browser refresh for full embed/resource cleanup --- */
function closeMatrix() {
  closeAllMatrixStreamPickers();
  closeQualityDropdowns();
  stopMatrixRefreshInterval();
  clearAllQualityTimers();
  matrixCountdownSeconds = 0;
  matrixRefreshCountdownEl.textContent = '';

  window.location.reload();
}

/* --- refreshMatrix — retrieve + generate + update via setChannel --- */
async function refreshMatrix() {
  await retrieveAll(true);
  generateFromCache();
  openMatrix();
}

/* --- Event listeners --- */
matrixBackdrop.querySelector('.matrix-close').addEventListener('click', closeMatrix);
matrixBody.addEventListener('click', async (e) => {
  const nameButton = e.target.closest('.matrix-streamer-name[data-role="matrix-name-picker"]');
  if (nameButton) {
    e.stopPropagation();
    const tile = nameButton.closest('.tile');
    await openMatrixTilePicker(tile);
    return;
  }
  closeAllMatrixStreamPickers();
});
matrixBackdrop.addEventListener('click', (e)=>{ if (e.target === matrixBackdrop) closeMatrix(); });
matrixRefreshBtn.onclick = async () => {
  if (matrixRefreshInProgress) return;
  matrixRefreshInProgress = true;
  try { await refreshMatrix(); }
  finally { matrixRefreshInProgress = false; }
};

/* ---------- Boot ---------- */
document.addEventListener("DOMContentLoaded", async ()=>{
  try{
    await loadStaticTiers();
  }catch(e){
    console.error(e);
    statusEl.textContent = "Failed to load static tiers file.";
  }

  loadPinBlacklistFromCookies();
  setupGrid();
  syncPinBlacklistButtons();
  initPersistence();
  attachStepperHandlers();
  statusEl.textContent = "Idle. Grid is ready. Click 'Retrieve' to fetch categories and statuses.";
  pickedEl.textContent = "";

  document.getElementById("retrieveBtn").onclick = () => retrieveAll(true);
  document.getElementById("generateBtn").onclick = generateFromCache;
  matrixBtn.onclick = openMatrix;
  openBtn.onclick = () => finalURL && window.open(finalURL, "_blank");
  multiBtn.onclick = () => multiURL && window.open(multiURL, "_blank");

  const gridEl = document.getElementById("gridContainer");
  gridEl.addEventListener("click", (e) => {
    const label = e.target.closest('span[id^="status-"]');
    if (!label) return;
    const name = label.id.replace('status-','');
    const r = resultsCache.get(name);
    if (!r?.isLive) return;
    openPreview({ title: name, nodes: [ makePreviewCard(name) ] });
  });
  gridEl.addEventListener("click", (e) => {
    const header = e.target.closest('.tier > h3');
    if (!header) return;
    const col = header.parentElement;
    const tierIndex = Array.prototype.indexOf.call(col.parentElement.children, col);
    const names = (tiers[tierIndex] || []).filter(n => (resultsCache.get(n)?.isLive));
    if (!names.length) return;
    const grid = document.createElement('div');
    grid.className = 'preview-grid';
    names.forEach(n => grid.appendChild(makePreviewCard(n)));
    openPreview({ title: header.textContent.trim(), nodes: [ grid ] });
  });
});
